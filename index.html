<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Quinto Ponto Cardeal">
<title>Imposto Voluntário · Euromilhões</title>
<meta name="description" content="EuroMillions odds, line generator and prize split, with the math to back it up. / Probabilidades, gerador de chaves e partilha de prémio do Euromilhões, com as contas.">
<meta name="theme-color" content="#0b1020">
<script>
  // Tema escolhido antes de desenhar a página: o que a pessoa guardou, senão o do sistema
  (function () {
    var t = null;
    try { t = localStorage.getItem('em_theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M32 10l6.5 14.2 15.5 1.8-11.5 10.5 3.2 15.3L32 43.8 18.3 51.8l3.2-15.3L10 26l15.5-1.8z' fill='%23f5c451'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #080c1f;
    --ink-2:    #0e1430;
    --panel:    #131a3d;
    --line:     rgba(150,170,255,0.12);
    --line-2:   rgba(150,170,255,0.22);
    --text:     #eef1ff;
    --muted:    #8e96c4;
    --muted-2:  #848cbe;
    --gold:     #f5c451;
    --gold-2:   #ffdd87;
    --gold-deep:#c8922b;
    --peri:     #9db4ff;
    --green:    #6ee7a8;
    --teal:     #38bdf8;
    --red:      #ff8a8a;
    --ball:     44px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  html { scroll-behavior:smooth; }
  body { background:var(--ink); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh; overflow-x:hidden; line-height:1.5; -webkit-font-smoothing:antialiased; }

  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .bg::before { content:''; position:absolute; inset:0; background: radial-gradient(1200px 700px at 50% -10%,rgba(70,90,200,.30),transparent 60%), radial-gradient(900px 600px at 85% 8%,rgba(245,196,81,.10),transparent 55%), radial-gradient(800px 800px at 10% 100%,rgba(80,60,180,.18),transparent 60%); }
  .bg::after { content:''; position:absolute; inset:0; opacity:.5; background-image: radial-gradient(1.4px 1.4px at 20% 30%,rgba(255,255,255,.7),transparent), radial-gradient(1.2px 1.2px at 70% 20%,rgba(255,236,180,.8),transparent), radial-gradient(1px 1px at 40% 70%,rgba(255,255,255,.5),transparent), radial-gradient(1.3px 1.3px at 85% 60%,rgba(255,255,255,.6),transparent), radial-gradient(1px 1px at 15% 85%,rgba(255,236,180,.6),transparent); background-repeat:no-repeat; animation:twinkle 6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.35} 50%{opacity:.6} }

  .wrap { position:relative; z-index:1; max-width:780px; margin:0 auto; padding:36px 20px 90px; }

  /* ── top bar ── */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px; flex-wrap:wrap; }
  .brand { font-family:'Fraunces',serif; font-weight:600; font-size:19px; }
  .brand b { color:var(--gold); font-weight:700; }
  .top-right { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
  .lucky-btn {
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; letter-spacing:.02em;
    color:#2a1c02; background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-deep));
    padding:9px 16px; border-radius:10px; text-decoration:none;
    box-shadow:0 6px 20px -8px rgba(245,196,81,.6);
    transition:transform .15s, box-shadow .2s, filter .15s;
    white-space:nowrap;
  }
  .lucky-btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px -8px rgba(245,196,81,.75); filter:saturate(1.1); }
  .lucky-btn:active { transform:translateY(0) scale(.98); }
  .lucky-star { font-size:11px; }
  .status { display:inline-flex; align-items:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .status .dot { width:7px; height:7px; border-radius:50%; background:var(--muted-2); transition:.3s; }
  .status.live .dot { background:var(--green); box-shadow:0 0 9px rgba(110,231,168,.7); }
  .status.off  .dot { background:var(--gold); }

  /* ── hero ── */
  .hero { position:relative; background:linear-gradient(165deg,var(--panel),var(--ink-2) 80%); border:1px solid var(--line); border-radius:22px; padding:32px 28px 28px; overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04); }
  .hero::before { content:''; position:absolute; inset:0; border-radius:22px; padding:1px; background:linear-gradient(160deg,rgba(245,196,81,.5),transparent 40%); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
  .hero-star-bg { position:absolute; top:-30px; right:-20px; font-size:130px; color:rgba(245,196,81,.06); line-height:1; pointer-events:none; transform:rotate(-8deg); }
  .hero-label { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  .eyebrow.dim { color:var(--muted); }
  .hero-jackpot { font-family:'Fraunces',serif; font-weight:600; font-size:clamp(44px,12vw,82px); line-height:.95; letter-spacing:-.02em; background:linear-gradient(150deg,var(--gold-2),var(--gold) 55%,var(--gold-deep)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-variant-numeric:tabular-nums; }
  .hero-cap { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-top:8px; }
  .hero-cap a { color:var(--peri); text-decoration:none; border-bottom:1px dotted var(--peri); }

  .countdown { display:flex; gap:8px; margin-top:20px; }
  .cd-unit { flex:1; text-align:center; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:12px; padding:10px 6px; }
  .cd-num { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:clamp(18px,5.5vw,28px); color:var(--text); font-variant-numeric:tabular-nums; }
  .cd-lab { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2); margin-top:4px; }

  /* ── info cards ── */
  .info { display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-top:12px; }
  .card { background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:15px 14px; }
  .card .k { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted-2); margin-bottom:8px; }
  .card .v { font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--text); line-height:1.15; }
  .card .v small { font-family:'JetBrains Mono',monospace; font-weight:400; font-size:12px; color:var(--muted); display:block; margin-top:4px; }
  .card .gold { color:var(--gold); }
  .mini-balls { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .mini { width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; background:#d8e2f8 !important; color:#1a2650 !important; flex-shrink:0; }
  .mini.s { background:#f5c451 !important; color:#3a2606 !important; }

  /* ── section header ── */
  .sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:36px 0 14px; flex-wrap:wrap; }
  .sec-head h2 { font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:-.01em; }
  .sec-head .hint { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }

  /* ── tabs ── */
  .tabs { display:flex; gap:0; margin-bottom:18px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .tab { flex:1; padding:11px 10px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); cursor:pointer; background:transparent; border:none; transition:.15s; }
  .tab.on { background:rgba(245,196,81,.14); color:var(--gold-2); }
  .tab:hover:not(.on) { background:rgba(255,255,255,.04); color:var(--text); }

  /* ── generate button ── */
  .cta { width:100%; padding:16px; border:none; cursor:pointer; border-radius:14px; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; letter-spacing:.02em; color:#2a1c02; background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-deep)); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 14px 30px -12px rgba(245,196,81,.55); transition:transform .15s,box-shadow .2s,filter .2s; }
  .cta:hover { transform:translateY(-2px); box-shadow:0 18px 38px -12px rgba(245,196,81,.7); filter:saturate(1.08); }
  .cta:active { transform:translateY(0) scale(.99); }
  .cta.loading { filter:saturate(.6) brightness(.9); pointer-events:none; }
  .cta-note { font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.6; color:var(--muted); margin-top:11px; text-align:center; }
  .cta-note b { color:var(--text); font-weight:500; }
  .spin { display:inline-block; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── combo cards ── */
  .combos { display:flex; flex-direction:column; gap:11px; }
  .combo { background:linear-gradient(165deg,var(--panel),var(--ink-2) 90%); border:1px solid var(--line); border-radius:16px; padding:18px 20px; opacity:0; transform:translateY(14px); animation:rise .42s forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .combo-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; flex-wrap:wrap; gap:6px; }
  .combo-id { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.16em; color:var(--muted); }
  .combo-id b { color:var(--gold); font-weight:500; }
  .combo-tag { font-family:'JetBrains Mono',monospace; font-size:12px; padding:3px 9px; border-radius:20px; background:rgba(157,180,255,.08); color:var(--peri); border:1px solid rgba(157,180,255,.18); }
  .combo-tag.teal { background:rgba(56,189,248,.08); color:var(--teal); border-color:rgba(56,189,248,.22); }

  .balls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* Bolas: sem gradientes, cor sólida garantida em todos os browsers */
  .ball {
    width:var(--ball); height:var(--ball);
    border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0; position:relative; overflow:hidden;
    font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700;
    /* cor do texto e fundo sólidos, nunca transparentes */
    color:#1a2650 !important;
    background:#d8e2f8 !important;
    box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.8);
    transition:transform .15s;
    /* garante que o texto fica por cima de tudo */
    line-height:1;
  }
  /* brilho via pseudoelemento, não interfere com o texto */
  .ball::before {
    content:''; position:absolute;
    top:4px; left:6px; width:40%; height:35%;
    background:rgba(255,255,255,0.55);
    border-radius:50%;
    pointer-events:none;
  }
  .ball span {
    position:relative; z-index:2;
    color:#1a2650; font-family:'JetBrains Mono',monospace;
    font-size:14px; font-weight:700; line-height:1;
    display:block;
  }
  .ball:hover { transform:translateY(-3px) scale(1.06); }
  .ball.hot {
    background:#ccd7f5 !important;
    box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.8),
               0 0 0 2.5px #f5c451, 0 0 12px rgba(245,196,81,.5);
  }
  .ball.star {
    background:#f5c451 !important;
    box-shadow:0 3px 8px rgba(120,80,0,.45), inset 0 1px 2px rgba(255,255,255,.7);
  }
  .ball.star span { color:#3a2606 !important; }
  .ball.star::before { background:rgba(255,255,255,0.45); }

  .sep { width:1px; height:28px; background:var(--line-2); margin:0 3px; flex-shrink:0; }
  .star-mark { font-size:11px; color:var(--gold); flex-shrink:0; }
  .combo-meta { margin-top:13px; padding-top:12px; border-top:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); line-height:1.6; }

  /* ── coverage badge ── */
  .cov-badge { display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:12px; padding:3px 8px; border-radius:6px; background:rgba(56,189,248,.1); color:var(--teal); border:1px solid rgba(56,189,248,.22); }

  /* ── coverage map ── */
  .cov-section { background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:14px; }
  .cov-title { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2); margin-bottom:14px; }
  .cov-grid { display:flex; flex-wrap:wrap; gap:5px; }
  .cov-num { width:32px; height:32px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; transition:.2s; }
  .cov-num.covered { background:rgba(56,189,248,.18); color:var(--teal); border:1px solid rgba(56,189,248,.35); }
  .cov-num.uncovered { background:rgba(255,255,255,.04); color:var(--muted-2); border:1px solid var(--line); }
  .cov-stats { display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }
  .cov-stat { font-family:'JetBrains Mono',monospace; font-size:12px; }
  .cov-stat .val { font-weight:700; }
  .cov-stat .val.g { color:var(--teal); }
  .cov-stat .val.y { color:var(--gold); }

  /* ── hot numbers ── */
  .hot { background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
  .hot-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .hot-num { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:#1a2650 !important; background:#d8e2f8 !important; }
  .bar { flex:1; height:6px; background:rgba(150,170,255,.12); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--gold-deep),var(--gold) 60%,var(--gold-2)); transition:width .7s cubic-bezier(.4,0,.2,1); }
  .hot-count { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); min-width:40px; text-align:right; }

  /* ── calculator ── */
  .calc { background:linear-gradient(165deg,var(--panel),var(--ink-2) 90%); border:1px solid var(--line); border-radius:16px; padding:22px 20px; }
  .presets { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:15px; }
  .preset { font-family:'JetBrains Mono',monospace; font-size:12px; padding:7px 10px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--text); cursor:pointer; transition:.15s; white-space:nowrap; }
  .preset:hover { border-color:var(--line-2); }
  .preset.on { background:rgba(245,196,81,.14); border-color:rgba(245,196,81,.5); color:var(--gold-2); }
  .calc-input { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .calc-input label { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .field { display:flex; align-items:center; background:var(--ink); border:1px solid var(--line-2); border-radius:10px; padding:0 12px; }
  .field span { font-family:'JetBrains Mono',monospace; color:var(--muted); }
  .field input { width:90px; background:none; border:none; outline:none; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:15px; padding:10px 4px; }
  .calc-out { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .out-box { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .out-box .k { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2); margin-bottom:7px; }
  .out-box .v { font-family:'Fraunces',serif; font-weight:600; font-size:20px; }
  .out-box .v.gold { color:var(--gold); }
  .out-box .v.green { color:var(--green); }
  .out-box .v small { font-family:'JetBrains Mono',monospace; font-weight:400; font-size:12px; color:var(--muted); display:block; margin-top:4px; letter-spacing:0; }
  .calc-foot { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-top:14px; line-height:1.7; }



  /* ── Curiosidades estatísticas ── */
  .stats-curiosity { display:flex; flex-direction:column; gap:0; }
  .curiosity-block { background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:22px 20px; }
  .curiosity-title { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--peri); margin-bottom:12px; letter-spacing:.03em; }
  .curiosity-text { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); line-height:1.75; margin-bottom:10px; }
  .curiosity-text b { color:var(--text); }
  .curiosity-note { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted-2); margin-top:12px; line-height:1.6; }
  .curiosity-note b { color:var(--muted); }
  .day-comparison { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0; }
  .day-card { border-radius:12px; padding:14px 16px; }
  .day-card.tue { background:rgba(157,180,255,.08); border:1px solid rgba(157,180,255,.25); }
  .day-card.fri { background:rgba(245,196,81,.06); border:1px solid rgba(245,196,81,.2); }
  .day-label { font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:4px; }
  .day-card.tue .day-label { color:var(--peri); }
  .day-card.fri .day-label { color:var(--gold); }
  .day-stat { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted-2); margin-bottom:10px; }
  .day-highlights { display:flex; flex-direction:column; gap:5px; }
  .day-hi { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); line-height:1.4; }
  .jackpot-list-wrap { overflow-x:auto; border-radius:10px; border:1px solid var(--line); margin:12px 0; }
  .jackpot-table { width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .jackpot-table th { background:rgba(255,255,255,.04); color:var(--muted-2); font-weight:500; padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .jackpot-table td { padding:9px 12px; border-bottom:1px solid rgba(150,170,255,.06); color:var(--text); }
  .jackpot-table tbody tr:last-child td { border-bottom:none; }
  .jackpot-table td:first-child { color:var(--muted-2); font-size:12px; }
  .jackpot-table .jv { color:var(--gold-2); font-weight:700; font-family:'Fraunces',serif; font-size:14px; }
  .tue-tag { color:var(--peri); font-weight:600; }
  .fri-tag { color:var(--gold); font-weight:600; }
  @media (max-width:560px) { .day-comparison { grid-template-columns:1fr; } }

  /* ── Partilha entre amigos ── */
  .split-section { background:linear-gradient(165deg,var(--panel),var(--ink-2) 90%); border:1px solid var(--line); border-radius:16px; padding:24px 22px; }
  .split-prize-row { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .split-prize-row label { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); white-space:nowrap; }
  .split-prize-input { display:flex; align-items:center; background:var(--ink); border:1px solid var(--line-2); border-radius:10px; padding:0 12px; }
  .split-prize-input span { font-family:'JetBrains Mono',monospace; color:var(--muted); }
  .split-prize-input input { width:130px; background:none; border:none; outline:none; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:15px; padding:10px 4px; }
  .split-prize-btns { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }

<script id="i18n">
// ─── LÍNGUAS ─────────────────────────────────────────────────────────────────
// Seis línguas, um dicionário por língua, sempre com as mesmas chaves.
// {nome} é preenchido na altura; as entradas { one, other } escolhem a forma
// pelo número (Intl.PluralRules). analysis/i18n_tests.js confirma que nenhuma
// chave falta. A língua escolhe-se por esta ordem: ?lang= no endereço, a escolha
// guardada neste browser, as línguas do browser e, se nenhuma servir, inglês
// (português se o browser não indicar língua nenhuma), como antes.
const LANGS = ['pt', 'en', 'es', 'fr', 'nl', 'de'];
const LOCALES = { pt: 'pt-PT', en: 'en-GB', es: 'es-ES', fr: 'fr-FR', nl: 'nl-NL', de: 'de-DE' };
function pickLang(search, stored, navLangs) {
  const ok = c => LANGS.indexOf(c) >= 0;
  let q = '';
  try { q = String(new URLSearchParams(search || '').get('lang') || '').toLowerCase(); } catch (e) {}
  if (ok(q)) return q;
  if (ok(stored)) return stored;
  const list = navLangs || [];
  for (let i = 0; i < list.length; i++) {
    const c = String(list[i] || '').slice(0, 2).toLowerCase();
    if (ok(c)) return c;
  }
  return list.length ? 'en' : 'pt';
}

  'who.intro': 'EuroMillions verpflichtet die Gewinner nicht, offenzulegen, wie sie gespielt haben, daher sind die Daten unvollständig. Öffentlich bekannte Fälle und Studien zu europäischen Lotterien zeigen aber klare Muster:',

  'who.c1b': 'Die <b>große Mehrheit der Jackpots</b> wurde mit Einzeltipps zu <b>2,50 €</b> gewonnen. Der bekannteste Fall in Portugal ist Ramalde in Porto (2024): <b>213,9 Mio. €, gewonnen mit einem einzigen Tipp zu 2,50 €</b>. Mehr Einsatz verbessert die Chance des einzelnen Tipps nicht. Er erhöht nur die Zahl der gekauften Tipps.',

  'who.c2t': 'Regelmäßige oder gelegentliche Spieler',
  'who.c2b': 'Es gibt Fälle an beiden Enden: Gewinner, die zum ersten Mal einen Schein gekauft hatten, und andere, die seit Jahrzehnten spielten. Da jede Ziehung unabhängig ist, <b>erhöht regelmäßiges Spielen die Chance bei einer bestimmten Ziehung nicht</b>. Man ist nur öfter „im Rennen“. Wer 20 Jahre lang 1 Schein pro Woche kauft, kommt auf etwa 2.080 Versuche, jeder mit einer Chance von 1 zu 139 Millionen.',

  'who.s1': 'Größter Gewinn in Portugal mit einem Einzeltipp (2,50 €): <b>213,9 Mio. €</b>, Ramalde, Porto, 2024',

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/), rows=[];
  for(let i=1;i<lines.length;i++){
    const p=lines[i].split(','); if(p.length<8||p[0]<CURRENT_FORMAT_FROM) continue;
    const nums=[p[1],p[2],p[3],p[4],p[5]].map(Number), stars=[p[6],p[7]].map(Number);
    if(nums.some(isNaN)||stars.some(isNaN)) continue;
    rows.push({date:p[0],nums,stars});
  }

}
function buildStats(rows){
  const nC={},nL={},sC={},sL={};
  for(let n=1;n<=50;n++){nC[n]=0;nL[n]=null;} for(let s=1;s<=12;s++){sC[s]=0;sL[s]=null;}
  let last='0000-00-00',lastRow=rows[rows.length-1];
  rows.forEach(r=>{ if(r.date>last){last=r.date;lastRow=r;} r.nums.forEach(n=>{nC[n]++;if(!nL[n]||r.date>nL[n])nL[n]=r.date;}); r.stars.forEach(s=>{sC[s]++;if(!sL[s]||r.date>sL[s])sL[s]=r.date;}); });

}

const LISBON = 'Europe/Lisbon';
const lisbonISO = ms => new Intl.DateTimeFormat('en-CA', { timeZone: LISBON, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms);
function lisbonOffsetMin(ms) {
  const f = new Intl.DateTimeFormat('en-GB', { timeZone: LISBON, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(ms);
  const g = t => +f.find(x => x.type === t).value;
  return (Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute')) - Math.floor(ms / 60000) * 60000) / 60000;
}
function nextDrawDateTime() {
  const now = Date.now();
  const [y, m, d] = lisbonISO(now).split('-').map(Number);
  for (let k = 0; k < 10; k++) {
    const base = Date.UTC(y, m - 1, d + k), wd = new Date(base).getUTCDay();
    if (wd !== 2 && wd !== 5) continue;
    const guess = base + (INFO.drawHour * 60 + INFO.drawMinute) * 60000;
    const t = guess - lisbonOffsetMin(guess) * 60000;
    if (t > now) return new Date(t);
  }
  return new Date(now + 86400000);
}
const NEXT_DRAW = nextDrawDateTime();
const SC_LINK = '<a href="https://www.jogossantacasa.pt/web/JogarEuromilhoes/" target="_blank" rel="noopener">Jogos Santa Casa</a>';
const SC_LINK_FOOT = SC_LINK.replace('<a ', '<a class="footlink" ');

function drawLabel() {
  const local = NEXT_DRAW.toLocaleString(LOC(), { weekday:'long', day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit' });
  const tf = { hour:'2-digit', minute:'2-digit' };
  const lis = NEXT_DRAW.toLocaleTimeString(LOC(), { ...tf, timeZone:LISBON });
  const loc = NEXT_DRAW.toLocaleTimeString(LOC(), tf);
  if (lis === loc) return local;
  let city = ''; try { city = Intl.DateTimeFormat().resolvedOptions().timeZone.split('/').pop().replace(/_/g, ' '); } catch (e) {}
  return `${local}${city ? ' (' + city + ')' : ''} · ${lis} ${tx('hero.lisbon')}`;
}

// ─── ALGORITMOS ──────────────────────────────────────────────────────────────
function validateCombination(numbers){
  const s=[...numbers].sort((a,b)=>a-b);
  let c=1,mx=1; for(let i=1;i<s.length;i++){if(s[i]===s[i-1]+1){c++;mx=Math.max(mx,c);}else c=1;}
  if(mx>2) return false;
  const ev=numbers.filter(n=>n%2===0).length; if(ev===0||ev===5) return false;
  const dec=[0,0,0,0,0]; numbers.forEach(n=>dec[Math.min(4,Math.floor((n-1)/10))]++);
  if(dec.filter(d=>d===0).length>3) return false;
  return true;
}

// ─── ALEATORIEDADE ───────────────────────────────────────────────────────────
// Cada clique em "Gerar" usa uma semente nova de 32 bits tirada de
// crypto.getRandomValues (a fonte aleatória do browser). Assim, duas pessoas
// que carreguem ao mesmo tempo recebem chaves diferentes, e a mesma pessoa
// recebe chaves novas a cada clique. As funções abaixo são as mesmas de
// analysis/prng.js, que tem testes próprios (node analysis/tests.js).
function freshSeed() {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }
  catch (e) { return (Math.random() * 0x100000000) >>> 0; }
}
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6d2b79f5) | 0;
    let z = Math.imul(s ^ (s >>> 15), 1 | s);
    z ^= z + Math.imul(z ^ (z >>> 7), 61 | z);
    return ((z ^ (z >>> 14)) >>> 0) / 0x100000000;
  };
}
const rngInt = (rng, n) => Math.floor(rng() * n);
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = rngInt(rng, i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function weightedSampleWithoutReplacement(pool, count, rng) {
  const remaining = pool.map(item => ({ ...item })), selected = [];
  for (let i = 0; i < count && remaining.length > 0; i++) {
    const total = remaining.reduce((t, x) => t + Math.max(1, x.freq), 0);
    let r = rng() * total, idx = 0;
    for (idx = 0; idx < remaining.length; idx++) { r -= Math.max(1, remaining[idx].freq); if (r <= 0) break; }
    idx = Math.min(idx, remaining.length - 1);
    selected.push(remaining[idx].number); remaining.splice(idx, 1);
  }
  return selected;
}

// Hot: amostragem ponderada (pela frequência) dos 20 números mais sorteados
function makeHotCombo(numberPool, starPool, rng) {
  let nums = [];
  for (let a = 0; a < 250; a++) { const c = weightedSampleWithoutReplacement(numberPool, 5, rng); if (c.length === 5 && validateCombination(c)) { nums = c.sort((x, y) => x - y); break; } }
  if (nums.length < 5) nums = shuffle(numberPool.map(s => s.number), rng).slice(0, 5).sort((x, y) => x - y);
  const stars = weightedSampleWithoutReplacement(starPool, 2, rng).sort((x, y) => x - y);
  const map = new Map(numberPool.map(s => [s.number, s]));
  const avg = nums.reduce((t, n) => t + (map.get(n)?.frequency || 0), 0) / nums.length;
  return { nums, stars, avg, newCovered: 0, newStarsCovered: 0 };
}

// Cobertura: set cover guloso, a preferir números ainda não cobertos
function makeCoverageCombo(allNums, allStars, coveredNums, coveredStars, rng) {
  const freqMapN = new Map(allNums.map(s => [s.number, s.freq]));
  const freqMapS = new Map(allStars.map(s => [s.number, s.freq]));
  const maxFreqN = Math.max(...allNums.map(s => s.freq)) || 1;
  const maxFreqS = Math.max(...allStars.map(s => s.freq)) || 1;
  // Um ruído por número e por estrela, sorteado uma vez por chave
  const noiseN = {}, noiseS = {};
  for (let n = 1; n <= 50; n++) noiseN[n] = rng();
  for (let t = 1; t <= 12; t++) noiseS[t] = rng();
  const scoreN = n => (coveredNums.has(n) ? 0 : 3) + (freqMapN.get(n) || 0) / maxFreqN + noiseN[n] * 0.5;
  const scoreS = t => (coveredStars.has(t) ? 0 : 3) + (freqMapS.get(t) || 0) / maxFreqS * 0.5 + noiseS[t] * 1.5;

  const ranked = [...Array(50)].map((_, i) => i + 1).sort((a, b) => scoreN(b) - scoreN(a));
  let best = null;
  for (let attempt = 0; attempt < 600; attempt++) {
    const pool = ranked.slice(0, 18 + rngInt(rng, 10)), pick = [];
    while (pick.length < 5 && pool.length > 0) pick.push(pool.splice(rngInt(rng, Math.min(8, pool.length)), 1)[0]);
    if (pick.length === 5 && validateCombination(pick)) {
      const nc = pick.filter(n => !coveredNums.has(n)).length;
      if (!best || nc > best.nc) best = { nums: pick.sort((a, b) => a - b), nc };
      if (nc >= 5) break;
    }
  }
  if (!best) best = { nums: ranked.slice(0, 5).sort((a, b) => a - b), nc: 0 };

  const stars = [...Array(12)].map((_, i) => i + 1).sort((a, b) => scoreS(b) - scoreS(a)).slice(0, 2).sort((a, b) => a - b);
  const nsc = stars.filter(t => !coveredStars.has(t)).length;
  return { nums: best.nums, stars, avg: best.nums.reduce((t, n) => t + (freqMapN.get(n) || 0) / maxFreqN, 0) / 5, newCovered: best.nc, newStarsCovered: nsc };
}

function generateHot(count, rng) {
  const numberPool = [...DATA.numbers].sort((a, b) => b.freq - a.freq).slice(0, 20);
  const starPool = [...DATA.stars].sort((a, b) => b.freq - a.freq).slice(0, 8);
  const combos = [], used = new Set();
  for (let i = 0; i < count; i++) {
    let c, t = 0;
    do { c = makeHotCombo(numberPool, starPool, rng); t++; } while (used.has(c.nums.join(',') + '|' + c.stars.join(',')) && t < 60);
    used.add(c.nums.join(',') + '|' + c.stars.join(',')); combos.push(c);
  }
  return combos;
}

function generateCoverage(count, rng) {
  const coveredNums = new Set(), coveredStars = new Set(), combos = [];
  // 10 chaves: baralha os 50 números e divide-os em 10 grupos de 5, até todos
  // os grupos passarem as regras; assim cada número aparece exatamente uma vez
  if (count * 5 === 50) {
    for (let a = 0; a < 5000; a++) {
      const all = shuffle([...Array(50)].map((_, i) => i + 1), rng);
      const groups = [...Array(10)].map((_, g) => all.slice(g * 5, g * 5 + 5));
      if (!groups.every(validateCombination)) continue;
      const fMap = new Map(DATA.numbers.map(s => [s.number, s.freq])), maxF = Math.max(...DATA.numbers.map(s => s.freq)) || 1;
      return groups.map(g => {
        const st = makeCoverageCombo(DATA.numbers, DATA.stars, coveredNums, coveredStars, rng).stars;
        const nums = [...g].sort((x, y) => x - y);
        const nc = nums.filter(n => !coveredNums.has(n)).length, nsc = st.filter(t => !coveredStars.has(t)).length;
        nums.forEach(n => coveredNums.add(n)); st.forEach(t => coveredStars.add(t));
        return { nums, stars: st, avg: nums.reduce((t, n) => t + (fMap.get(n) || 0) / maxF, 0) / 5, newCovered: nc, newStarsCovered: nsc };
      });
    }
  }
  for (let i = 0; i < count; i++) {
    const c = makeCoverageCombo(DATA.numbers, DATA.stars, coveredNums, coveredStars, rng);
    c.nums.forEach(n => coveredNums.add(n)); c.stars.forEach(t => coveredStars.add(t));
    combos.push(c);
  }
  return combos;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function comboMeta(nums,fMap,mode,combo){
  const s=[...nums].sort((a,b)=>a-b);
  const ev=nums.filter(n=>n%2===0).length,odd=5-ev,sum=s.reduce((a,b)=>a+b,0);
  let top=s[0],tf=-1; s.forEach(n=>{const f=fMap.get(n)?.freq??0;if(f>tf){tf=f;top=n;}});
  const avgPct=s.reduce((a,n)=>a+(fMap.get(n)?.frequency||0),0)/s.length*100;
  const base=[tx('combo.odd',{count:odd,n:odd})+' · '+tx('combo.even',{count:ev,n:ev}),tx('combo.sum',{n:sum}),tx('combo.avg',{p:pctF(avgPct,1)}),tx('combo.top',{n:top,f:tf})].join('  ·  ');
  if(mode==='hot') return base;
  return base+`  ·  <span class="cov-badge">${combo.newCovered>0?tx('combo.new',{count:combo.newCovered,n:combo.newCovered}):tx('combo.allCovered')}</span>`;
}

function calcOdds(){
  const budget=parseFloat(document.getElementById('budget').value)||0;
  const lines=Math.floor(budget/INFO.pricePerLine);
  const oL=document.getElementById('oLines'),oJ=document.getElementById('oJackpot'),oA=document.getElementById('oAny'),oC=document.getElementById('oCtx');
  if(lines<=0){oL.textContent='0';oJ.textContent='—';oA.innerHTML='—<small>'+tx('calc.tiers')+'</small>';oC.textContent=tx('calc.min');return;}
  const jackOne=Math.round(INFO.jackpotOdds/lines);
  const anyP=1-Math.pow(1-1/INFO.anyPrizeOdds,lines);
  oL.textContent=tx('lines',{count:lines,n:num0.format(lines)});
  oJ.innerHTML=`${tx('oneIn',{n:num0.format(jackOne)})}<small>${pctWrap(dec((lines/INFO.jackpotOdds*100).toPrecision(2)))}</small>`;
  const anyPct=anyP*100;
  oA.innerHTML=`≈ ${pctWrap(anyPct>=99.5?'~100':dec(anyPct.toFixed(anyPct<10?1:0)))}<small>${tx('calc.tiers')}</small>`;
  oC.textContent=jackOne>30000000?tx('calc.lightning'):jackOne>1000000?tx('calc.millions'):tx('calc.unlikely',{n:num0.format(jackOne)});
}

// ─── PARTILHA & HISTÓRICO ────────────────────────────────────────────────────
const TAX_THRESHOLD = 5000;
const TAX_RATE      = 0.20;

function applyTax(gross) {
  if (gross <= TAX_THRESHOLD) return { gross, tax:0, net:gross };
  const tax = gross * TAX_RATE;
  return { gross, tax, net: gross - tax };
}

function setPrize(btn) {
  document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const v = parseFloat(btn.dataset.prize);
  const note = document.getElementById('prize2note');
  if (btn.dataset.prize === '0') {
    document.getElementById('splitPrize').value = '';
    document.getElementById('splitPrize').focus();
    note.style.display = 'none';
  } else {
    document.getElementById('splitPrize').value = v;
    note.style.display = btn.dataset.prize === '500000' ? 'block' : 'none';
  }
  calcSplit();
}

function onPrizeInput() {
  document.querySelectorAll('.prize-btn').forEach(b => b.classList.remove('on'));
  document.getElementById('prize2note').style.display = 'none';
  calcSplit();
}

function calcSplit() {
  const prize  = parseFloat(document.getElementById('splitPrize').value) || 0;
  const people = Math.max(1, Math.min(100, Math.floor(parseFloat(document.getElementById('splitPeople').value) || 1)));
  const out    = document.getElementById('splitResults');

  if (prize <= 0) {
    out.innerHTML = '<div style="font-family:JetBrains Mono,monospace;font-size:12px;color:var(--muted);padding:12px 0">' + tx('split.enter') + '</div>';
    return;
  }

  // Prémio dividido em partes iguais; o imposto aplica-se à parte de cada pessoa
  const t = applyTax(prize / people);
  const taxed = t.gross > TAX_THRESHOLD;
  const label = people === 1 ? tx('split.full') : tx('split.share', { n: people });
  out.innerHTML = `<div class="split-person">
      <div class="split-row-head">
        <span class="split-name">🤝 ${people === 1 ? tx('split.one') : tx('split.each', { n: people })}</span>
        <span class="split-stake-badge">${label}</span>
      </div>
      <div class="split-gross">${money(t.gross)}</div>
      <div class="split-tax-row">
        <div class="split-tax-item"><span class="tk">${tx('split.gross')}</span><span class="tv">${money(t.gross)}</span></div>
        ${taxed
          ? `<div class="split-tax-item"><span class="tk">${tx('split.tax')}</span><span class="tv tax">- ${money(t.tax)}</span></div>
             <div class="split-tax-item"><span class="tk">${tx('split.net')}</span><span class="tv net">${money(t.net)}</span></div>`
          : `<div class="split-tax-item"><span class="tv net">${tx('split.free')}</span></div>`}

}

// ─── HISTÓRICO ────────────────────────────────────────────────────────────────
const HIST_KEY = 'em_hist_v1';
// Text typed by the visitor is shown as text, never as HTML.
const escHtml = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let histData = [];

function histLoad() {
  try { histData = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { histData = []; }
}
function histSave() {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(histData)); } catch {}
}

function hKeyAdd() {
  const wrap = document.getElementById('hKeysWrap');
  if (wrap.children.length >= 10) return;
  const n = wrap.children.length + 1;
  const row = document.createElement('div');
  row.className = 'hkey-row';
  row.innerHTML = `<input type="text" class="hkey-input" placeholder="${keyPh(n)}" maxlength="30">`;
  wrap.appendChild(row);
}
function hKeyRemove() {
  const wrap = document.getElementById('hKeysWrap');
  if (wrap.children.length > 1) wrap.removeChild(wrap.lastChild);
}
function hKeyRead() {
  return [...document.querySelectorAll('.hkey-input')]
    .map(i => i.value.trim()).filter(v => v.length > 0);
}
function hKeyReset() {
  const wrap = document.getElementById('hKeysWrap');
  wrap.innerHTML = '<div class="hkey-row"><input type="text" class="hkey-input" placeholder="'+keyPh(1)+'" maxlength="30"></div>';
}

// Normalise a key string to comparable form: sorted numbers
function normaliseKey(s) {
  const nums = s.match(/\d+/g);
  if (!nums || nums.length < 5) return null;
  return nums.map(Number).sort((a,b)=>a-b).join('-');
}

function histAdd() {
  const date  = document.getElementById('hDate').value;
  const stake = parseFloat(document.getElementById('hStake').value) || 0;
  const won   = parseFloat(document.getElementById('hWon').value)   || 0;
  const keys  = hKeyRead();
  if (!date || stake <= 0) {
    alert(tx('hist.alert')); return;
  }
  histData.push({ id: Date.now(), date, stake, won, keys });
  histData.sort((a,b) => b.date.localeCompare(a.date));
  histSave();
  histRender();
  document.getElementById('hWon').value = '0';
  hKeyReset();
}

function histDelete(id) {
  histData = histData.filter(r => r.id !== id);
  histSave();
  histRender();
}

function histRender() {
  const body    = document.getElementById('histBody');
  const empty   = document.getElementById('histEmpty');
  const totWrap = document.getElementById('histTotals');

  if (histData.length === 0) {
    body.innerHTML = '';
    empty.style.display = 'block';
    totWrap.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  totWrap.style.display = 'grid';

  const fmtD = d => new Date(d + 'T12:00:00Z').toLocaleDateString(LOC(), { timeZone:'UTC', day:'2-digit', month:'2-digit', year:'numeric' });
  const fmtE = v => eur0.format(Math.round(v*100)/100);

  // Build set of all normalised keys across all records to detect repetitions
  const allNorm = {};  // normKey -> count
  histData.forEach(r => (r.keys||[]).forEach(k => {
    const n = normaliseKey(k); if (n) allNorm[n] = (allNorm[n]||0) + 1;
  }));

  body.innerHTML = histData.map(r => {
    const ret = r.stake > 0 ? ((r.won - r.stake) / r.stake * 100) : 0;
    const retClass = ret > 0 ? 'pos' : ret < 0 ? 'neg' : 'zero';
    const retStr = r.stake > 0 ? (ret >= 0 ? '+' : '') + pctWrap(ret.toFixed(0)) : '—';

    const keysHtml = (r.keys && r.keys.length > 0)
      ? r.keys.map(k => {
          const n = normaliseKey(k);
          const repeated = n && allNorm[n] > 1;
          const tip = repeated ? tx('hist.repTip', { n: allNorm[n] }) : k;
          return `<span class="hist-key-tag${repeated?' repeated':''}" title="${escHtml(tip)}">${escHtml(k)}</span>`;
        }).join('')
      : '<span style="color:var(--muted-2);font-size:11px;">—</span>';

    return `<tr>
      <td>${fmtD(r.date)}</td>
      <td class="hist-keys-cell">${keysHtml}</td>
      <td>${fmtE(r.stake)}</td>
      <td style="color:${r.won > 0 ? 'var(--green)' : 'var(--muted)'}">${fmtE(r.won)}</td>
      <td class="hist-ret ${retClass}">${retStr}</td>
      <td><button class="hist-del" onclick="histDelete(${Number(r.id) || 0})" title="${tx('hist.del')}">✕</button></td>
    </tr>`;
  }).join('');

  // Totals
  const totalStake = histData.reduce((s,r) => s + r.stake, 0);
  const totalWon   = histData.reduce((s,r) => s + r.won,   0);
  const balance    = totalWon - totalStake;
  const avgRet     = totalStake > 0 ? (balance / totalStake * 100) : 0;
  document.getElementById('htStake').textContent = fmtE(totalStake);
  document.getElementById('htWon').textContent   = fmtE(totalWon);
  const balEl = document.getElementById('htBalance');
  balEl.textContent = (balance >= 0 ? '+' : '') + fmtE(balance);
  balEl.className   = 'v ' + (balance > 0 ? 'g' : balance < 0 ? 'r' : '');
  const retEl = document.getElementById('htRet');
  retEl.textContent = (avgRet >= 0 ? '+' : '') + pctWrap(dec(avgRet.toFixed(1)));
  retEl.className   = 'v ' + (avgRet > 0 ? 'g' : avgRet < 0 ? 'r' : '');

  // Key repetition summary
  const repeated = Object.entries(allNorm).filter(([,c])=>c>1);
  const existing = document.getElementById('histKeyNote');
  if (existing) existing.remove();
  if (repeated.length > 0) {
    const note = document.createElement('p');
    note.id = 'histKeyNote';
    note.style.cssText = "font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);margin-top:12px;line-height:1.6;";
    note.innerHTML = tx('hist.repNote', { count: repeated.length, n: repeated.length });
    totWrap.after(note);
  }
}

function histInit() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('hDate').value = today;
  histLoad();
  histRender();
}

// ─── ROLLOVER PROBABILITY ────────────────────────────────────────────────────
// P(nenhuma das N apostas ganha) = (1 - 1/ODDS)^N  ≈  e^(-N/ODDS)
const JACKPOT_ODDS = 139838160;

function rolloverProb(nTickets) {
  return Math.exp(-nTickets / JACKPOT_ODDS) * 100;
}

// Apostas vendidas por sorteio, estimadas a partir do jackpot (a EuroMillions não publica o total)
const ROLL_SCEN = [
  { max:30e6,     n:50e6,  key:'roll.s0' },
  { max:60e6,     n:70e6,  key:'roll.s1' },
  { max:100e6,    n:100e6, key:'roll.s2' },
  { max:170e6,    n:120e6, key:'roll.s3' },
  { max:240e6,    n:180e6, key:'roll.s4' },
  { max:Infinity, n:250e6, key:'roll.s5' },
];

function renderCuriosities() {
  // Terça ou sexta: contagens do CSV e recordes divididos pelo dia da semana
  const day = document.getElementById('dayBlock');
  if (day) {
    const rec = RECORDS.map(([amt, iso, ctry]) => ({ amt, iso, ctry, wd: new Date(iso + 'T12:00:00Z').getUTCDay() }));
    const list = wd => rec.filter(r => r.wd === wd).map(r => `<div class="day-hi">&#127941; ${fmtMil(r.amt)}, ${dShort(new Date(r.iso + 'T12:00:00Z'))} (${tx('country.' + r.ctry)})</div>`).join('');
    const nT = rec.filter(r => r.wd === 2).length, nF = rec.filter(r => r.wd === 5).length;
    const has = DATA.tue > 0 || DATA.fri > 0;
    const counts = has ? tx('fun.dayCounts', { tue: num0.format(DATA.tue), fri: num0.format(DATA.fri) }) : tx('fun.dayNoData');
    day.innerHTML = `
      <div class="curiosity-title">&#9654; ${tx('fun.dayTitle')}</div>
      <p class="curiosity-text">${counts}</p>
      <p class="curiosity-text">${tx('fun.dayIndep')}</p>
      <div class="day-comparison">
        <div class="day-card tue"><div class="day-label">${tx('day.tue')}</div><div class="day-stat">${tx('fun.ofTop10', { n: nT })}</div><div class="day-highlights">${list(2)}</div></div>
        <div class="day-card fri"><div class="day-label">${tx('day.fri')}</div><div class="day-stat">${tx('fun.ofTop10', { n: nF })}</div><div class="day-highlights">${list(5)}</div></div>
      </div>
      <p class="curiosity-note">${has ? tx('fun.dayData', { n: num0.format(DATA.draws), date: dShort(DATA.lastDraw) }) : tx('fun.dayConcl')}</p>`;
  }

  // Rollover: P(ninguém ganha) com N apostas, para vários níveis de jackpot
  const roll = document.getElementById('rollBlock');
  if (roll) {
    const cur = ROLL_SCEN.find(sc => INFO.nextJackpot < sc.max);
    const grid = ROLL_SCEN.map(sc => {
      const p = rolloverProb(sc.n), cls = p >= 65 ? 'hi' : p >= 40 ? 'mid' : 'lo';
      return `<div class="rv-box"><div class="k">${tx(sc.key)}</div><div class="v ${cls}">${pctWrap(p.toFixed(0))}</div><div class="sub">${tx('roll.chance')}<br>${tx('roll.sold', { n: num0.format(sc.n / 1e6) })}</div></div>`;
    }).join('');
    roll.innerHTML = `
      <div class="curiosity-title">&#9654; ${tx('roll.title')}</div>
      <p class="curiosity-text">${tx('roll.p1')}</p>
      <p class="curiosity-text">${tx('roll.p2')}</p>
      <div class="rollover-grid">${grid}</div>
      <p class="curiosity-text" style="margin-top:14px;">${tx('roll.p3')}</p>
      <p class="curiosity-text">${tx('roll.p4', { amt: fmtM(INFO.nextJackpot), date: dDay(INFO.updatedISO), pct: pctWrap(rolloverProb(cur.n).toFixed(0)) })}</p>
      <p class="curiosity-note">${tx('roll.note')}</p>`;
  }
}

// ─── LEMBRETES E SUGESTÕES ───────────────────────────────────────────────────
// Sugestões: com SUGGEST_ENDPOINT preenchido (endereço de um formulário do
// Formspree, por exemplo https://formspree.io/f/abcdwxyz), a mensagem segue por lá.
// Vazio: copia a mensagem e abre a página de contacto da Quinto Ponto Cardeal

const SUGGEST_ENDPOINT = '';
const SITE_URL = 'https://pachecodecastro.github.io/euromilhoes/';
function setText(id, t) { const el = document.getElementById(id); if (el) el.textContent = t; }
// Ficheiro .ics com um evento que se repete às terças e sextas, na hora de Lisboa
function buildReminderICS(hour) {
  const pad = n => String(n).padStart(2, '0');
  const day = lisbonISO(NEXT_DRAW).replace(/-/g, '');
  const now = new Date(), stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const esc = t => t.replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const url = SITE_URL + '?lang=' + LANG;
  const summary = esc(tx('ics.summary'));
  const desc = esc(tx('ics.desc', { url }));
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Quinto Ponto Cardeal//Imposto Voluntario//PT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE', 'TZID:Europe/Lisbon',
    'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0000', 'TZOFFSETTO:+0100', 'TZNAME:WEST', 'DTSTART:19700329T010000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
    'BEGIN:STANDARD', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0000', 'TZNAME:WET', 'DTSTART:19701025T020000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT', `UID:euromilhoes-${day}-${hour}@quintopontocardeal.org`, `DTSTAMP:${stamp}`,
    `DTSTART;TZID=Europe/Lisbon:${day}T${pad(hour)}0000`, 'DURATION:PT15M', 'RRULE:FREQ=WEEKLY;BYDAY=TU,FR',
    `SUMMARY:${summary}`, `DESCRIPTION:${desc}`, `URL:${url}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${summary}`, 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR', ''
  ].join('\r\n');
}
function downloadReminder() {
  const hour = parseInt(document.getElementById('remHour').value, 10) || 18;
  const blob = new Blob([buildReminderICS(hour)], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = tx('rem.file');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  setText('remStatus', tx('rem.done'));
}
async function sendSuggestion() {
  const msg = (document.getElementById('sugMsg').value || '').trim();
  const email = (document.getElementById('sugEmail').value || '').trim();
  const st = document.getElementById('sugStatus');
  st.style.color = 'var(--red)';
  if (msg.length < 3) { st.textContent = tx('sug.empty'); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { st.textContent = tx('sug.badEmail'); return; }
  if (SUGGEST_ENDPOINT) {
    try {
      const fd = new FormData(); fd.append('message', msg); if (email) fd.append('email', email); fd.append('lang', LANG); fd.append('_subject', 'Sugestão · Imposto Voluntário');
      const r = await fetch(SUGGEST_ENDPOINT, { method: 'POST', body: fd, headers: { Accept: 'application/json' } });
      if (!r.ok) throw 0;
      document.getElementById('sugMsg').value = '';
      st.style.color = 'var(--green)'; st.textContent = tx('sug.sent');
    } catch (e) { st.textContent = tx('sug.fail'); }
    return;
  }
  try { await navigator.clipboard.writeText(msg + (email ? '\n\n' + email : '')); } catch (e) {}
  window.open(tx('url.contact'), '_blank', 'noopener');
  st.style.color = 'var(--green)';
  st.textContent = tx('sug.opened');
}

// ─── MÚLTIPLAS ───────────────────────────────────────────────────────────────
// C(n, k) = n! / (k! * (n-k)!)
function C(n, k) {
  if (k > n) return 0;
  if (k === 0 || k === n) return 1;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return Math.round(r);
}

function multApostas(nums, stars) {
  // C(nums, 5) × C(stars, 2)
  return C(nums, 5) * C(stars, 2);
}

function buildMultTable() {
  const tbody = document.getElementById('multTableBody');
  if (!tbody) return;
  tbody.innerHTML = '';
  for (let n = 5; n <= 10; n++) {
    const tr = document.createElement('tr');
    let cells = `<td>${tx('mult.rowNums', { n })}</td>`;
    for (let s = 2; s <= 10; s++) {
      const ap = multApostas(n, s);
      const custo = ap * 2.5;
      const isSimples = n === 5 && s === 2;
      const cls = isSimples ? 'simples' : '';
      const custoFmt = custo >= 1000 ? dec((custo/1000).toFixed(custo%1000===0?0:1))+'k€' : dec(custo.toFixed(custo%1===0?0:2))+'€';
      cells += `<td class="${cls}" data-n="${n}" data-s="${s}">
        <span class="ap">${num0.format(ap)}</span>
        <span class="cu">${custoFmt}</span>
      </td>`;
    }
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  }
}

function updateMult() {
  const nums  = parseInt(document.getElementById('mNums').value);
  const stars = parseInt(document.getElementById('mStars').value);
  document.getElementById('mNumsVal').textContent  = nums;
  document.getElementById('mStarsVal').textContent = stars;

  const ap    = multApostas(nums, stars);
  const custo = ap * 2.5;
  const jackP = 1 - Math.pow(1 - 1/139838160, ap);  // P(pelo menos 1 jackpot)
  const jackOne = Math.round(139838160 / ap);

  document.getElementById('mApostas').textContent = tx('lines', { count: ap, n: num0.format(ap) });
  document.getElementById('mCusto').innerHTML     = eur0.format(custo) + (custo>500?`<small>${tx('mult.perDraw')}</small>`:'');
  document.getElementById('mJackpot').innerHTML   = `${tx('oneIn', { n: num0.format(jackOne) })}<small>${pctWrap(dec((jackP*100).toPrecision(2)))}</small>`;
  document.getElementById('mVs').innerHTML        = tx('mult.more', { n: num0.format(ap) });

  // Formula explanation
  const cN = C(nums,5), cS = C(stars,2);
  document.getElementById('mFormula').innerHTML =
    `C(${nums},5) × C(${stars},2) = ${num0.format(cN)} × ${num0.format(cS)} = <b>${tx('lines', { count: ap, n: num0.format(ap) })}</b>`+
    ` &nbsp;·&nbsp; ${tx('mult.costWord')} ${eur0.format(custo)}`+
    (nums===5&&stars===2?` &nbsp;·&nbsp; ${tx('mult.single')}`:'');

  // Highlight active cell in table
  document.querySelectorAll('#multTableBody td').forEach(td => {
    const n = parseInt(td.dataset.n), s = parseInt(td.dataset.s);
    if (!isNaN(n)) {
      td.classList.toggle('active', n===nums && s===stars);
    }
  });
}
