name: Update EuroMillions results
on: {schedule: [{cron: '30 23 * * 2'}, {cron: '30 23 * * 5'}], workflow_dispatch: {}}
permissions: {contents: write}
jobs: {update: {runs-on: ubuntu-latest, timeout-minutes: 15, steps: [{uses: 'actions/checkout@v7'}, {name: Tests, run: 'node analysis/tests.js && python3 -m unittest discover -s analysis'}, {name: Fetch results, id: fetch, run: 'bash scripts/update-results.sh'}, {name: Chi-square report, if: "steps.fetch.outputs.changed == 'true'", run: 'bash scripts/chi2-report.sh'}, {name: Commit, if: "steps.fetch.outputs.changed == 'true'", run: 'git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add data/euromilhoes.csv; git commit -m "data: atualiza resultados EuroMillhões (${{ steps.fetch.outputs.lines }} linhas)"; git push'}]}}
